- name: Collect CDP Neighbors
  hosts: allHosts
  gather_facts: false

  tasks:
    - name: Ensure cdp_output directory exists
      ansible.builtin.file:
        path: /ansible/cdp_output
        state: directory
      delegate_to: localhost
      run_once: true

    - name: Run show cdp neighbors detail
      cisco.ios.ios_command:
        commands:
          - show cdp neighbors detail
      register: cdp_detail
      ignore_errors: true

    - name: Set output from detail if successful
      ansible.builtin.set_fact:
        cdp_raw: "{{ cdp_detail.stdout[0] }}"
      when: cdp_detail is defined and cdp_detail.failed != true

    - name: Fallback to show cdp neighbors (brief)
      cisco.ios.ios_command:
        commands:
          - show cdp neighbors
      register: cdp_brief
      ignore_errors: true
      when: cdp_raw is not defined

    - name: Set output from brief fallback
      ansible.builtin.set_fact:
        cdp_raw: "{{ cdp_brief.stdout[0] }}"
      when: cdp_brief is defined and cdp_brief.failed != true and cdp_raw is not defined

    - name: Save CDP output to file
      ansible.builtin.copy:
        content: "{{ cdp_raw | default('') }}"
        dest: "/ansible/cdp_output/{{ inventory_hostname }}.txt"
      delegate_to: localhost
      when: cdp_raw is defined
