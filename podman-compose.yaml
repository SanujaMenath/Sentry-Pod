version: "3.8"

services:
  vault:
    image: mongo:latest
    container_name: sentry-pod_vault_1
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: sentry_pod
      MONGO_INITDB_ROOT_PASSWORD: Admin123
    ports:
      - "27017:27017"
    volumes:
      - vault-data:/data/db

  watchman:
    build: ./watchman
    restart: always
    depends_on:
      - vault
    environment:
      DATABASE_URL: mongodb://sentry_pod:Admin123@vault:27017/sentry_nms?authSource=admin
    ports:
      - "8000:8000"
    volumes:
      - ./watchman:/app:Z

  command-center:
    image: fresh-command-center
    restart: always
    depends_on:
      - watchman
    ports:
      - "3000:80"
    environment:
      - REACT_APP_API_URL=http://localhost:8000

volumes:
  vault-data:
