version: "3.8"

services:
  vault:
    image: mongo:latest
    container_name: sentry-pod_vault_1
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: sentry_pod
      MONGO_INITDB_ROOT_PASSWORD: Admin123
    ports:
      - "27017:27017"
    volumes:
      - vault-data:/data/db

  watchman:
    build: ./watchman
    restart: always
    privileged: true
    depends_on:
      - vault
    environment:
      MONGO_URI: mongodb://sentry_pod:Admin123@vault:27017/sentry_pod_db?authSource=admin
    ports:
      - "8000:8000"
    volumes:
      - ./watchman:/app:Z
      - ./watchman/registries.conf:/etc/containers/registries.conf:ro
      - /tmp:/tmp:ro

  syslog-ng:
    build:
      context: ./watchman
      dockerfile: Dockerfile.syslog-ng
    container_name: sentry-pod_syslog-ng_1
    restart: always
    ports:
      - "10514:10514/udp"
    volumes:
      - ./watchman/playbooks/gns3_lab.conf:/etc/syslog-ng/conf.d/gns3_lab.conf:Z
      - ./watchman/scripts/syslog_listener.sh:/usr/local/bin/syslog_listener.sh:Z
      - ./watchman/playbooks/syslog/:/var/log/syslog/:z

  command-center:
    build: ./command-center
    image: fresh-command-center
    restart: always
    ports:
      - "3000:80"

volumes:
  vault-data:
